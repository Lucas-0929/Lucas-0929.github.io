<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order - Campus Helper</title>
    <style>
        /* Reset default spacing and set the common font. */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        /* Page background gradient. */
        body { background: linear-gradient(135deg, #dbeafe 0%, #d1fae5 100%); min-height: 100vh; }

        /* Shared navigation bar and active-page indicator. */
        .nav { display: flex; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        .nav a { flex: 1; text-align: center; padding: 16px 0; text-decoration: none; color: #556; font-weight: 600; border-bottom: 3px solid transparent; }
        .nav a.active { color: #2563eb; border-bottom-color: #2563eb; }

        /* Center the order form and display it as a card. */
        .main { max-width: 600px; margin: 0 auto; padding: 30px 20px; }
        .form-box { background: #fff; border-radius: 16px; padding: 30px 26px; box-shadow: 0 4px 14px rgba(0,0,0,.1); }
        .page-title { font-size: 26px; color: #1f4e79; margin-bottom: 8px; }
        .page-sub { color: #667; margin-bottom: 24px; font-size: 14px; }

        /* Consistent spacing and appearance for form fields. */
        .group { margin-bottom: 18px; }
        .group label { display: block; font-weight: 600; margin-bottom: 6px; color: #2b3a4a; }
        .group input, .group select, .group textarea {
            width: 100%; padding: 12px; border: 1px solid #d6e0ec; border-radius: 10px;
            background: #f8fafc; font-size: 15px;
        }
        .group textarea { height: 110px; resize: none; }
        .time-slots-image { display: block; width: 100%; height: auto; margin-bottom: 10px; border-radius: 10px; }

        /* Submit button and hover state. */
        .btn { width: 100%; padding: 13px; background: #22a06b; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; }
        .btn:hover { background: #1b8a5a; }

        /* Page footer. */
        .footer { text-align: center; padding: 24px; color: #778; font-size: 13px; }
    </style>
</head>
<body>

    <!-- Main site navigation. -->
    <nav class="nav">
        <a href="index.html">Home</a >
        <a href="order.html" class="active">Order</a >
        <a href="faq.html">About & FAQ</a >
    </nav>

    <main class="main">
        <div class="form-box">
            <!-- Order page heading and runner instruction. -->
            <h1 class="page-title">Place Your Order</h1>
            <p class="page-sub">Fill in the details below, our runner will contact you.</p >

            <!-- Order details are collected here for the runner. -->
            <!-- Submitting the order redirects the user back to the home page. -->
            <form action="index.html" method="get">
                <div class="group">
                    <label>Service Type</label>
                    <select>
                        <option>Pick up parcel</option>
                        <option>Buy snacks</option>
                        <option>Print documents</option>
                        <option>Deliver items</option>
                    </select>
                </div>
                <div class="group">
                    <label>Your Location / Dorm</label>
                    <input type="text" placeholder="e.g. Dorm 3, Room 205">
                </div>
                <div class="group">
                    <label>Time Slot</label>
                    <img class="time-slots-image" src="images/time-slots.jpg" alt="Available time slot examples: 09:00 to 12:00, 12:00 to 13:00, and 18:00 to 21:00">
                    <select>
                        <option>12:00 – 13:00</option>
                        <option>16:00 – 17:00</option>
                        <option>19:00 – 20:00</option>
                    </select>
                </div>
                <div class="group">
                    <label>Extra Notes</label>
                    <textarea placeholder="Any special requirements?"></textarea>
                </div>
                <button type="submit" class="btn">Submit Order</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Campus Helper</p >
    </footer>

</body>
</html>
